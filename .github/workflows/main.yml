name: Deploy to S3

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # Caches the Yarn store keyed on yarn.lock, so `yarn install` only downloads
          # what changed.
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Cold build measures ~7s, ~3s once .next/cache is restored.
      - name: Cache Next.js and TypeScript build output
        uses: actions/cache@v6
        with:
          path: |
            .next/cache
            tsconfig.tsbuildinfo
          key: ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'next.config.js', 'tsconfig.json', 'postcss.config.js', 'tailwind.config.js') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('yarn.lock') }}-

      # The compiled PDF is cached against the source it was built from, so a deploy that does
      # not touch resume/resume.tex skips the TeX Live image pull entirely — that pull alone
      # measures ~125s. Keying on the file hash rather than the commit means a hit is always
      # the PDF for the current source, and any edit to the source misses and rebuilds. Bump
      # the v1 prefix to force a rebuild.
      - name: Restore the compiled resume PDF
        id: resume-cache
        uses: actions/cache/restore@v6
        with:
          path: public/assets/Resume_Ong Yik Tatt.pdf
          key: resume-pdf-v1-${{ hashFiles('resume/resume.tex') }}

      # On a cache miss the PDF is rebuilt and written into public/ before `yarn build`, which
      # copies public/ into the static export. A LaTeX failure fails the deploy rather than
      # shipping a stale PDF silently.
      - name: Build resume PDF
        if: steps.resume-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: resume.tex
          working_directory: resume

      # The action runs in Docker as root, so the PDF it writes is root-owned. `mv` still
      # succeeds: both resume/ and public/assets/ belong to the runner, and rename only needs
      # write permission on the directories.
      - name: Publish resume PDF as a static asset
        if: steps.resume-cache.outputs.cache-hit != 'true'
        run: mv resume/resume.pdf "public/assets/Resume_Ong Yik Tatt.pdf"

      # Saved explicitly rather than relying on actions/cache's post-step: a post-step runs even
      # when an earlier step failed, which would cache the stale committed PDF under the new
      # source's key and then serve that stale file on every later run.
      - name: Cache the compiled resume PDF
        if: steps.resume-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: public/assets/Resume_Ong Yik Tatt.pdf
          key: resume-pdf-v1-${{ hashFiles('resume/resume.tex') }}

      - name: Build
        env:
          NEXT_PUBLIC_CONTACT_VERIFY_URL: ${{ vars.CONTACT_VERIFY_URL }}
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.RECAPTCHA_SITE_KEY }}
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-build
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: site-build
          path: out/

      # An unset repository variable becomes an empty string, which the aws CLI reports as a
      # usage error rather than naming the culprit. Fail here instead. printenv keeps this
      # shell-agnostic (no bash-only indirect expansion).
      - name: Check required repository variables
        run: |
          missing=0
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is not set. Add it under Settings > Secrets and variables > Actions > Variables."
              missing=1
            fi
          done
          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: aws s3 sync ./out "${S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
